services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: assemblia
      POSTGRES_USER: assemblia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assemblia -d assemblia"]
      interval: 5s
      retries: 10
  api:
    image: ${ASSEMBLIA_IMAGE:-assemblia-local:development}
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: ${RUNTIME_DATABASE_CONNECTION:?Set a restricted runtime database connection}
      Storage__Root: /app/storage
      DataProtection__KeyPath: /app/keys
      PublicUrl: ${PUBLIC_URL:?Set PUBLIC_URL}
      Smtp__Host: ${SMTP_HOST}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__From: ${SMTP_FROM}
    ports: ["127.0.0.1:5080:8080"]
    volumes:
      - data-protection:/app/keys
      - object-data:/app/storage
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres-data:
  data-protection:
  object-data:
