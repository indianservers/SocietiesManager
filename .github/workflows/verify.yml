name: Verify Phases 1–6
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['55439:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm run test:navigation
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm audit --omit=dev
        working-directory: frontend
      - run: dotnet build backend
      - run: dotnet list backend package --vulnerable --include-transitive
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-17
      - run: pip install -r tests/requirements.txt
      - run: mkdir -p .local && python -c 'import json;json.dump({"password":"ci-only-password"},open(".local/dev.json","w"))'
      - run: python tests/studio_integration.py
      - run: python tests/runtime_role_integration.py
      - run: python tests/phase6_pdf_qa.py
      - run: python tests/benchmark.py
      - run: python tests/membership_benchmark.py
      - run: python tests/membership_api_benchmark.py
      - run: python tests/community_api_benchmark.py
      - run: python tests/communication_api_benchmark.py
      - run: python tests/finance_api_benchmark.py
      - run: python tests/phase6_api_benchmark.py
      - run: python tests/backup_security_integration.py
      - run: python tests/backup_restore_integration.py
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
      - run: dotnet publish backend -c Release -o .local/release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            tests/*.json
            tests/phase6-*.pdf
            tests/phase6-*.png
